model_list:
  - model_name: claude-sonnet-5
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-5
      aws_region_name: us-east-1

  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: us-east-1

general_settings:
  master_key: sk-1234

guardrails:
  - guardrail_name: aws-prompt-attack-scanner
    litellm_params:
      guardrail: bedrock
      mode: pre_call
      default_on: true
      guardrailIdentifier: 1pkg9iw5lbhl
      guardrailVersion: DRAFT
      aws_region_name: us-east-1
      scan_only_tool_results: true

  - guardrail_name: download-allowlist
    litellm_params:
      guardrail: tool_permission
      mode: post_call
      default_on: true
      default_action: allow
      on_disallowed_action: block
      rules:
        - id: deny-downloads-outside-allowlist
          tool_name: "(?i)bash"
          decision: deny
          allowed_param_patterns:
            command: '(?s)(?!.*(?:docs\.litellm\.ai|pypi\.org))(?=.*\b(?:curl|wget)\b).*'
